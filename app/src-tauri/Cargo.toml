[package]
name = "pdfshrinker-app"
version = "0.1.0"
description = "Smaller is better — and still beautiful."
authors = ["Pascal Havé <contact@haveneer.com>"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.1", features = [] }

[dependencies]
pdfshrink-core = { path = "../../crates/pdfshrink-core" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.0.3", features = [] }
tauri-plugin-dialog = "2"
