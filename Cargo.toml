[workspace]
resolver = "2"
members = [
    "crates/pdfshrink-core",
    "crates/pdfshrink-cli",
    "crates/pdfshrink-wasm",
    "app/src-tauri",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
authors = ["Pascal Havé <contact@haveneer.com>"]

[workspace.dependencies]
# Default features (chrono clock, rayon) are opted into by pdfshrink-core's
# `native` feature only: the WebAssembly build has neither threads nor a clock.
lopdf = { version = "0.45", default-features = false }
# No codec: JPEG goes through jpeg.rs (tests and examples enable `jpeg` to write fixtures).
image = { version = "0.25", default-features = false }
mozjpeg = "0.10"
jpeg-encoder = "0.7"
# Decodes our own re-encoded JPEGs: zune-jpeg (the `image` crate's decoder) misreads
# jpeg-encoder's baseline output with optimized Huffman tables.
jpeg-decoder = { version = "0.3", default-features = false }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
directories = "6"
clap = { version = "4", features = ["derive"] }
rayon = "1"
anyhow = "1"
thiserror = "2"
tempfile = "3"
flate2 = "1"
hayro-jpeg2000 = { version = "0.4", default-features = false, features = ["std", "simd"] }
fax = "0.3"
zopfli = { version = "0.8", default-features = false, features = ["std", "zlib"] }
