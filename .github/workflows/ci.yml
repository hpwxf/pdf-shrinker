name: CI

# Apple Silicon only, matching the project itself (aarch64-apple-darwin, no
# x86_64/universal build — see CLAUDE.md) — so this only ever runs on macOS
# runners, no Linux/Windows matrix.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: macos-14 # arm64 (Apple Silicon) runner
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # The pdfshrinker-app crate's build.rs refuses to build unless its
      # externalBin sidecar exists on disk (see CLAUDE.md) — build it and
      # stage it first so clippy/test can touch the whole workspace.
      - name: Build the CLI and stage it as the app's sidecar binary
        run: |
          cargo build --release -p pdfshrink-cli --target aarch64-apple-darwin --locked
          mkdir -p app/src-tauri/binaries
          cp target/aarch64-apple-darwin/release/pdfshrink app/src-tauri/binaries/pdfshrink-aarch64-apple-darwin

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

  build-app:
    name: build .app + .dmg
    runs-on: macos-14
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Cache tauri-cli
        id: cache-tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-2-${{ runner.os }}-${{ runner.arch }}

      - name: Install tauri-cli
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build .app + .dmg (ad-hoc signed)
        run: ./scripts/build-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: PdfShrinker-dmg
          path: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
